name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew chiseledBuild

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UnblockBannedServers-builds
          path: |
            versions/*/build/libs/unblockbannedservers-mc-*.jar
            !versions/*/build/libs/unblockbannedservers-mc-*-sources.jar
          if-no-files-found: error

      - name: Prepare release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          find versions -type f \
            -path '*/build/libs/unblockbannedservers-mc-*.jar' \
            ! -name '*-sources.jar' \
            > release-files.txt

          test -s release-files.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Latest Build
          prerelease: true
          make_latest: false
          files: |
            versions/*/build/libs/unblockbannedservers-mc-*.jar
